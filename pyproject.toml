[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-security-canary"
version = "0.1.0"
description = "Deterministic canary scoring for AI agent tool-use traces"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["agentic_security_canary*"]
